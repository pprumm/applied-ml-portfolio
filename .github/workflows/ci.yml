name: CI - Deployment Demo

on:
  push:
    paths:
      - "deployment-demo/**"
  pull_request:
    paths:
      - "deployment-demo/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deployment-demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          pip install -r requirements.txt

      - run: |
          python -c "from app import app; print('API import OK')"